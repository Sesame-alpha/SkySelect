<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkySelect — Flight Seat Booking</title>
<style>
  :root{
    --bg: #170c0e;
    --surface: #2a1318;
    --surface-soft: #341a20;
    --crimson: #b3122e;
    --crimson-bright: #e0273f;
    --rose: #e6b4ba;
    --rose-dim: #7a5a5e;
    --gold-line: #c98a52;
    --text: #f6e9ea;
    --text-dim: #b89aa0;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html{
    background: var(--bg);
  }

  body{
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  .display{
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.04em;
  }

  header{
    text-align: center;
    margin-bottom: 24px;
  }

  header h1{
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    margin: 0 0 6px;
    color: var(--rose);
  }

  header p{
    margin: 0;
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  .flight-card{
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .flight-card span strong{
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--crimson-bright);
    margin-bottom: 2px;
    font-weight: 600;
  }

  .cabin{
    width: 100%;
    max-width: 460px;
  }

  .nose{
    width: 100%;
    height: 28px;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: linear-gradient(180deg, var(--crimson-bright), var(--crimson));
    box-shadow: 0 6px 30px 4px rgba(224, 39, 63, 0.4);
    margin-bottom: 4px;
  }

  .nose-label{
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    margin: 6px 0 22px;
    text-transform: uppercase;
  }

  .seat-map{
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    margin-bottom: 22px;
  }

  .class-divider{
    width: 100%;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-line);
    margin: 14px 0 8px;
    position: relative;
  }

  .class-divider::before,
  .class-divider::after{
    content: '';
    position: absolute;
    top: 50%;
    width: 28%;
    height: 1px;
    background: var(--surface-soft);
  }
  .class-divider::before{ left: 0; }
  .class-divider::after{ right: 0; }

  .row{
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .row-label{
    width: 24px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    font-weight: 600;
  }

  .seats{
    display: grid;
    gap: 6px;
    grid-auto-flow: column;
  }

  .aisle{
    width: 18px;
  }

  .seat{
    width: clamp(24px, 7.5vw, 34px);
    height: clamp(24px, 7.5vw, 34px);
    border-radius: 6px 6px 3px 3px;
    border: 1.5px solid var(--rose-dim);
    background: transparent;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    padding: 0;
    font-size: 0.6rem;
    color: var(--text-dim);
  }

  .seat:hover:not(:disabled){
    transform: translateY(-2px);
    border-color: var(--rose);
  }

  .seat.selected{
    background: var(--crimson-bright);
    border-color: var(--crimson-bright);
    box-shadow: 0 0 10px rgba(224,39,63,0.55);
    color: var(--text);
  }

  .seat.occupied{
    background: var(--surface-soft);
    border-color: var(--surface-soft);
    cursor: not-allowed;
    opacity: 0.55;
  }

  .seat.business:not(.occupied):not(.selected){
    border-color: var(--gold-line);
  }

  .legend{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    margin-bottom: 28px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .legend-item{
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .legend-swatch{
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--rose-dim);
  }

  .legend-swatch.selected{ background: var(--crimson-bright); border-color: var(--crimson-bright); }
  .legend-swatch.occupied{ background: var(--surface-soft); border-color: var(--surface-soft); }
  .legend-swatch.business{ border-color: var(--gold-line); }

  .summary{
    background: var(--surface);
    border: 1px solid var(--surface-soft);
    border-radius: var(--radius);
    padding: 18px 20px;
    width: 100%;
  }

  .summary h2{
    margin: 0 0 12px;
    font-size: 1.1rem;
    color: var(--rose);
    font-weight: 600;
  }

  .summary-row{
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 6px 0;
    border-bottom: 1px solid var(--surface-soft);
    color: var(--text-dim);
  }

  .summary-row:last-of-type{ border-bottom: none; }

  .summary-row span:last-child{ color: var(--text); font-weight: 600; }

  .summary-total{
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--surface-soft);
    font-size: 1.1rem;
    font-weight: 700;
  }

  .summary-total span:last-child{ color: var(--crimson-bright); }

  .confirm-btn{
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border: none;
    border-radius: var(--radius);
    background: var(--crimson);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
    letter-spacing: 0.02em;
  }

  .confirm-btn:hover:not(:disabled){ background: var(--crimson-bright); }

  .confirm-btn:disabled{
    background: var(--surface-soft);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--crimson);
    color: var(--text);
    padding: 12px 22px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }

  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer{
    margin-top: 36px;
    font-size: 0.72rem;
    color: var(--rose-dim);
    letter-spacing: 0.05em;
  }

  @media (max-width: 380px){
    .seats{ gap: 4px; }
    .row{ gap: 4px; }
    .row-label{ width: 20px; font-size: 0.7rem; }
    .legend{ gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="display">SkySelect</h1>
  <p>Choose your seat for this flight</p>
  <div class="flight-card">
    <span><strong>Flight</strong>BA 247</span>
    <span><strong>Route</strong>GBE → JNB</span>
    <span><strong>Date</strong>14 Jun</span>
    <span><strong>Aircraft</strong>A320</span>
  </div>
</header>

<div class="cabin">

  <div class="nose"></div>
  <div class="nose-label">Front of aircraft</div>

  <div class="seat-map" id="seatMap"></div>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch"></span> Available</div>
    <div class="legend-item"><span class="legend-swatch business"></span> Business</div>
    <div class="legend-item"><span class="legend-swatch selected"></span> Selected</div>
    <div class="legend-item"><span class="legend-swatch occupied"></span> Taken</div>
  </div>

  <div class="summary">
    <h2 class="display">Booking Summary</h2>
    <div class="summary-row"><span>Seats selected</span><span id="seatCount">0</span></div>
    <div class="summary-row"><span>Economy (P650)</span><span id="economyCount">0</span></div>
    <div class="summary-row"><span>Business (P1800)</span><span id="businessCount">0</span></div>
    <div class="summary-row"><span>Seat numbers</span><span id="seatList">—</span></div>
    <div class="summary-total"><span>Total</span><span id="total">P0</span></div>
    <button class="confirm-btn" id="confirmBtn" disabled>Confirm booking</button>
  </div>

</div>

<footer>SkySelect · built by Sesame Dithupa</footer>
<div class="toast" id="toast"></div>

<script>
  // Business class: rows 1-3, 2-2 layout
  // Economy class: rows 4-20, 3-3 layout
  const BUSINESS_ROWS = [1,2,3];
  const ECONOMY_ROWS = Array.from({length: 17}, (_, i) => i + 4); // 4-20
  const BUSINESS_COLS = ['A','B','D','E'];
  const ECONOMY_COLS = ['A','B','C','D','E','F'];
  const PRICES = { economy: 650, business: 1800 };
  const STORAGE_KEY = 'skyselect_occupied';

  const DEFAULT_OCCUPIED = [
    '1A','1B','2D','3E','4C','4D','6A','6F','8B','8C','8D',
    '10A','10F','12C','12D','15B','15E','18A','18F','20C'
  ];

  let occupied = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || DEFAULT_OCCUPIED;
  let selected = new Set();

  const seatMap = document.getElementById('seatMap');

  function buildRow(rowNum, cols, isBusiness){
    const row = document.createElement('div');
    row.className = 'row';

    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = rowNum;
    row.appendChild(label);

    const left = document.createElement('div');
    left.className = 'seats';
    left.style.gridTemplateColumns = `repeat(${Math.floor(cols.length / 2)}, 1fr)`;

    const right = document.createElement('div');
    right.className = 'seats';
    right.style.gridTemplateColumns = `repeat(${Math.ceil(cols.length / 2)}, 1fr)`;

    const half = Math.floor(cols.length / 2);

    cols.forEach((col, idx) => {
      const seatId = rowNum + col;
      const btn = document.createElement('button');
      btn.className = 'seat';
      btn.dataset.seat = seatId;
      btn.textContent = col;
      btn.setAttribute('aria-label', `Seat ${seatId}`);

      if(isBusiness) btn.classList.add('business');
      if(occupied.includes(seatId)){
        btn.classList.add('occupied');
        btn.disabled = true;
      }

      btn.addEventListener('click', () => toggleSeat(seatId, btn));

      if(idx < half) left.appendChild(btn);
      else right.appendChild(btn);
    });

    const aisle = document.createElement('div');
    aisle.className = 'aisle';

    row.appendChild(left);
    row.appendChild(aisle);
    row.appendChild(right);
    return row;
  }

  function buildMap(){
    seatMap.innerHTML = '';

    const businessDivider = document.createElement('div');
    businessDivider.className = 'class-divider';
    businessDivider.textContent = 'Business';
    seatMap.appendChild(businessDivider);

    BUSINESS_ROWS.forEach(r => seatMap.appendChild(buildRow(r, BUSINESS_COLS, true)));

    const economyDivider = document.createElement('div');
    economyDivider.className = 'class-divider';
    economyDivider.textContent = 'Economy';
    seatMap.appendChild(economyDivider);

    ECONOMY_ROWS.forEach(r => seatMap.appendChild(buildRow(r, ECONOMY_COLS, false)));
  }

  function toggleSeat(seatId, btn){
    if(selected.has(seatId)){
      selected.delete(seatId);
      btn.classList.remove('selected');
    } else {
      selected.add(seatId);
      btn.classList.add('selected');
    }
    updateSummary();
  }

  function updateSummary(){
    const seatArr = Array.from(selected).sort();
    let economyCount = 0, businessCount = 0;

    seatArr.forEach(seatId => {
      const rowNum = parseInt(seatId);
      if(BUSINESS_ROWS.includes(rowNum)) businessCount++;
      else economyCount++;
    });

    const total = economyCount * PRICES.economy + businessCount * PRICES.business;

    document.getElementById('seatCount').textContent = seatArr.length;
    document.getElementById('economyCount').textContent = economyCount;
    document.getElementById('businessCount').textContent = businessCount;
    document.getElementById('seatList').textContent = seatArr.length ? seatArr.join(', ') : '—';
    document.getElementById('total').textContent = `P${total}`;

    document.getElementById('confirmBtn').disabled = seatArr.length === 0;
  }

  function showToast(message){
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }

  document.getElementById('confirmBtn').addEventListener('click', () => {
    if(selected.size === 0) return;

    occupied = occupied.concat(Array.from(selected));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(occupied));

    const count = selected.size;
    selected.clear();
    buildMap();
    updateSummary();

    showToast(`Booking confirmed for ${count} seat${count > 1 ? 's' : ''}`);
  });

  buildMap();
  updateSummary();
</script>

</body>
</html>
